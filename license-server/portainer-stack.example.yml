version: "3.7"

## Servidor de licenças (USO INTERNO — roda só na sua VPS).
## A URL pública dele é a LICENSE_SERVER_URL embutida nas imagens dos clientes: não mude depois de vender.
## Imagem privada: no Portainer, cadastre o registry ghcr.io com seu usuário GitHub + token (read:packages).

services:
  hublabel-licenca:
    image: ghcr.io/victoreder/hublabel-licenca:latest

    environment:
      # SEU Supabase (do vendedor), com as tabelas de license-server/sql/001_licencas.sql
      SUPABASE_URL: https://SEU-PROJETO.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: COLE_AQUI_SUA_SERVICE_ROLE_KEY
      # Saída de "node scripts/gerar-chaves.js" (linha da chave PRIVADA)
      LICENSE_PRIVATE_KEY: COLE_AQUI_A_CHAVE_PRIVADA_BASE64
      # Senha das rotas /admin (gere uma longa: openssl rand -hex 32)
      ADMIN_TOKEN: COLE_AQUI_UM_TOKEN_LONGO
      # Horas que o cliente segue rodando se este servidor cair
      GRACE_HOURS: "72"
      NODE_ENV: production

    networks:
      - RedeVictor

    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
      restart_policy:
        condition: any
        delay: 5s
      labels:
        - traefik.enable=true
        - traefik.docker.network=RedeVictor
        - traefik.http.routers.hublabel_licenca.rule=Host(`licenca.victoreder.com.br`)
        - traefik.http.routers.hublabel_licenca.entrypoints=websecure
        - traefik.http.routers.hublabel_licenca.tls.certresolver=letsencryptresolver
        - traefik.http.routers.hublabel_licenca.service=hublabel_licenca
        - traefik.http.services.hublabel_licenca.loadbalancer.server.port=3100

networks:
  RedeVictor:
    external: true
    name: RedeVictor
