version: "3.7"

## LICENCA_EMAIL: o e-mail usado na compra. Igual nos 3 serviços.
## A licença fica presa ao SUPABASE_URL desta instalação.

## BACK_URL com path opcional (ex.: .../webhook). Telas e rotas ficam em BACK_URL/<slug>
## (ex.: https://webhook2.victoreder.com.br/webhook/login). O inbound remove o prefixo sozinho.

services:

  disparador-meta:
    image: ghcr.io/victoreder/hublabel-disparador:latest

    environment:
      SUPABASE_URL: https://SEU-PROJETO.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: COLE_AQUI_SUA_SERVICE_ROLE_KEY
      LICENCA_EMAIL: email-da-compra@exemplo.com
      NODE_ENV: production

    networks:
      - RedeVictor

    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 512M
      restart_policy:
        condition: any
        delay: 5s

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  disparador-evolution:
    image: ghcr.io/victoreder/hublabel-disparador:latest
    command: ["node", "src/workers/evolution.js"]

    environment:
      SUPABASE_URL: https://SEU-PROJETO.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: COLE_AQUI_SUA_SERVICE_ROLE_KEY
      LICENCA_EMAIL: email-da-compra@exemplo.com
      EVOLUTION_BASE_URL: https://evolution2.victoreder.com.br
      EVOLUTION_API_KEY: COLE_AQUI_SUA_APIKEY_EVOLUTION
      NODE_ENV: production

    networks:
      - RedeVictor

    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 512M
      restart_policy:
        condition: any
        delay: 5s

    healthcheck:
      disable: true

  disparador-inbound:
    image: ghcr.io/victoreder/hublabel-disparador:latest
    command: ["node", "src/inbound.js"]

    environment:
      SUPABASE_URL: https://SEU-PROJETO.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: COLE_AQUI_SUA_SERVICE_ROLE_KEY
      LICENCA_EMAIL: email-da-compra@exemplo.com
      ## Anon key pública do Supabase (a mesma que as telas usam no navegador).
      SUPABASE_ANON_KEY: COLE_AQUI_SUA_ANON_KEY
      BACK_URL: https://webhook2.victoreder.com.br/webhook
      S3_ENDPOINT: https://s32.victoreder.com.br
      S3_ACCESS_KEY_ID: COLE_S3_ACCESS_KEY
      S3_SECRET_ACCESS_KEY: COLE_S3_SECRET_KEY
      S3_PUBLIC_BASE_URL: https://s32.victoreder.com.br/n8n
      REDIS_URL: redis://redis:6379
      NODE_ENV: production

    networks:
      - RedeVictor

    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 512M
      restart_policy:
        condition: any
        delay: 5s
      labels:
        - traefik.enable=true
        - traefik.docker.network=RedeVictor
        ## O domínio inteiro vai para o inbound (telas, ações e webhooks — sem n8n).
        ## O próprio app remove o prefixo do BACK_URL (/webhook), então não precisa de StripPrefix.
        - traefik.http.routers.disparador_inbound.rule=Host(`webhook2.victoreder.com.br`)
        - traefik.http.routers.disparador_inbound.entrypoints=websecure
        - traefik.http.routers.disparador_inbound.tls.certresolver=letsencryptresolver
        - traefik.http.routers.disparador_inbound.service=disparador_inbound
        - traefik.http.services.disparador_inbound.loadbalancer.server.port=3090
        - traefik.http.services.disparador_inbound.loadbalancer.passHostHeader=1

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3090/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  RedeVictor:
    external: true
    name: RedeVictor
