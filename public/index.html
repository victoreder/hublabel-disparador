<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HubLabel — Software de WhatsApp</title>
  <meta name="description" content="HubLabel — software de WhatsApp para gestão e automação de atendimento." />
  <style>
    :root {
      --bg: #0b1220;
      --bg-soft: #111827;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #22c55e;
      --accent-soft: rgba(34, 197, 94, 0.12);
      --border: rgba(148, 163, 184, 0.2);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: radial-gradient(ellipse 80% 60% at 50% -10%, var(--accent-soft), transparent),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-soft) 100%);
      color: var(--text);
    }
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 48px 24px 32px;
    }
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      max-width: 560px;
      margin: 0 auto;
    }
    .brand {
      margin: 0 0 12px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
    }
    h1 {
      margin: 0 0 16px;
      font-size: clamp(2rem, 6vw, 2.75rem);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.02em;
    }
    .tagline {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.6;
      color: var(--muted);
      max-width: 420px;
    }
    .site-footer {
      text-align: center;
      padding-top: 32px;
      border-top: 1px solid var(--border);
      max-width: 640px;
      margin: 0 auto;
      width: 100%;
    }
    .footer-links { margin-bottom: 12px; font-size: 14px; }
    .footer-links a { color: var(--text); text-decoration: none; }
    .footer-links a:hover { color: var(--accent); text-decoration: underline; }
    .sep { margin: 0 10px; color: var(--muted); }
    .legal, .copy {
      margin: 6px 0 0;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="page">
    <main class="hero">
      <p class="brand">HubLabel</p>
      <h1>Software de WhatsApp</h1>
      <p class="tagline">
        Plataforma para conectar, gerenciar e automatizar atendimentos pelo WhatsApp
        com segurança e integração oficial.
      </p>
    </main>

    <footer class="site-footer">
      <nav class="footer-links">
        <a href="/politica-de-privacidade">Política de Privacidade</a>
        <span class="sep">·</span>
        <a href="/termos-de-uso">Termos de Uso</a>
      </nav>
      <p class="legal">
        RX Estratégias Digitais LTDA · CNPJ 48.713.673/0001-15
      </p>
      <p class="copy">© HubLabel — Todos os direitos reservados.</p>
    </footer>
  </div>
</body>
</html>
