name: Build and Push Docker Image

on:
  push:
    branches: [main]
    paths-ignore:
      - 'license-server/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/victoreder/hublabel-disparador

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A imagem distribuída exige licença; sem estas variáveis o build não pode sair.
      - name: Check license variables
        env:
          LICENSE_PUBLIC_KEY: ${{ vars.LICENSE_PUBLIC_KEY }}
          LICENSE_SERVER_URL: ${{ vars.LICENSE_SERVER_URL }}
        run: |
          if [ -z "$LICENSE_PUBLIC_KEY" ] || [ -z "$LICENSE_SERVER_URL" ]; then
            echo "::error::Defina as variáveis LICENSE_PUBLIC_KEY e LICENSE_SERVER_URL em Settings → Secrets and variables → Actions → Variables (ver docs/LICENCIAMENTO.md)."
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            LICENSE_PUBLIC_KEY=${{ vars.LICENSE_PUBLIC_KEY }}
            LICENSE_SERVER_URL=${{ vars.LICENSE_SERVER_URL }}
