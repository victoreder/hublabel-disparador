services:
  disparador-meta:
    build:
      context: .
      args:
        LICENSE_PUBLIC_KEY: ${LICENSE_PUBLIC_KEY}
        LICENSE_SERVER_URL: ${LICENSE_SERVER_URL}
    container_name: hublabel-disparador-meta
    restart: unless-stopped
    ports:
      - "3080:3080"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3080

  disparador-evolution:
    build:
      context: .
      args:
        LICENSE_PUBLIC_KEY: ${LICENSE_PUBLIC_KEY}
        LICENSE_SERVER_URL: ${LICENSE_SERVER_URL}
    container_name: hublabel-disparador-evolution
    restart: unless-stopped
    command: ["node", "src/workers/evolution.js"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
    healthcheck:
      disable: true

  disparador-inbound:
    build:
      context: .
      args:
        LICENSE_PUBLIC_KEY: ${LICENSE_PUBLIC_KEY}
        LICENSE_SERVER_URL: ${LICENSE_SERVER_URL}
    container_name: hublabel-disparador-inbound
    restart: unless-stopped
    command: ["node", "src/inbound.js"]
    ports:
      - "3090:3090"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      INBOUND_PORT: 3090
